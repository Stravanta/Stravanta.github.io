<title>STRAVANTA</title>

<!-- Theme -->

<style>
  :root{
    --bg:#050308;
    --ink:#f4f1ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:none;
  }
  body{
    position:relative;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* ambient drifting color blobs beneath the particle canvas */
  .aura{
    position:fixed;
    inset:0;
    z-index:0;
    filter: blur(70px) saturate(140%);
    opacity:.55;
    pointer-events:none;
  }
  .aura span{
    position:absolute;
    border-radius:50%;
    mix-blend-mode: screen;
    will-change: transform;
  }
  .aura span:nth-child(1){
    width:46vmax;height:46vmax; left:-10vmax; top:-14vmax;
    background: radial-gradient(circle at 30% 30%, #4d1bff, transparent 70%);
    animation: drift1 26s ease-in-out infinite;
  }
  .aura span:nth-child(2){
    width:50vmax;height:50vmax; right:-16vmax; bottom:-18vmax;
    background: radial-gradient(circle at 60% 60%, #ff1f8f, transparent 70%);
    animation: drift2 32s ease-in-out infinite;
  }
  .aura span:nth-child(3){
    width:34vmax;height:34vmax; right:8vmax; top:-10vmax;
    background: radial-gradient(circle at 50% 50%, #00e5c7, transparent 70%);
    animation: drift3 21s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(8vmax,6vmax) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-10vmax,-4vmax) scale(1.1); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-6vmax,8vmax) scale(0.9); }
  }

  canvas#field{
    position:fixed;
    inset:0;
    z-index:1;
    display:block;
  }

  /* fine grain overlay for texture */
  .grain{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode: overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* vignette */
  .vignette{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(2,1,6,.75) 100%);
  }

  .hint{
    position:fixed;
    left:0; right:0;
    bottom:6vh;
    z-index:5;
    text-align:center;
    font-family: Georgia, serif;
    font-style:italic;
    font-size:12px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:rgba(244,241,255,.32);
    pointer-events:none;
    opacity:0;
    transition: opacity 2.4s ease 2.6s;
  }
  .hint.show{ opacity:1; }

  .rubro-link{
    color:rgba(244,241,255,.55);
    text-decoration:none;
    pointer-events:auto;
    cursor:pointer;
    border-bottom:1px solid rgba(244,241,255,.25);
    padding-bottom:2px;
    transition: color .3s ease, border-color .3s ease;
  }
  .rubro-link:hover,
  .rubro-link:focus{
    color:#f4f1ff;
    border-color:rgba(244,241,255,.7);
  }

  /* custom glow cursor */
  .cursor{
    position:fixed;
    z-index:6;
    top:0; left:0;
    width:26px; height:26px;
    margin:-13px 0 0 -13px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 70%);
    pointer-events:none;
    will-change: transform;
    transition: opacity .3s ease;
  }
  @media (hover:none){
    .cursor{ display:none; }
    body{ cursor:auto; }
  }
</style>

<div class="aura"><span></span><span></span><span></span></div>
<canvas id="field"></canvas>
<div class="grain"></div>
<div class="vignette"></div>
<div class="hint" id="hint"><a class="rubro-link" id="rubroLink" href="https://raven3.com.ar/webs-por-rubro.html" target="_blank" rel="noopener">byRaven3</a></div>
<div class="cursor" id="cursor"></div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d', { alpha: true });
  var cursorEl = document.getElementById('cursor');
  var hintEl = document.getElementById('hint');

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  var mouse = { x: -9999, y: -9999, active: false };
  var pointerIsFine = window.matchMedia('(hover:hover)').matches;

  var particles = [];
  var targets = [];
  var startedAt = performance.now();
  var settled = false;

  // ---------- palette: cosmic ultraviolet -> magenta -> molten gold ----------
  function paletteColor(t){
    // t in [0,1] across the word's width
    var stops = [
      [0.00, [ 79,  70, 255]],   // ultraviolet
      [0.35, [190,  60, 255]],   // violet-magenta
      [0.62, [255,  45, 150]],   // hot pink
      [0.85, [255, 130,  60]],   // ember orange
      [1.00, [255, 205,  90]]    // gold
    ];
    for (var i = 0; i < stops.length - 1; i++) {
      var a = stops[i], b = stops[i + 1];
      if (t >= a[0] && t <= b[0]) {
        var lt = (t - a[0]) / (b[0] - a[0] || 1);
        var r = a[1][0] + (b[1][0] - a[1][0]) * lt;
        var g = a[1][1] + (b[1][1] - a[1][1]) * lt;
        var bl = a[1][2] + (b[1][2] - a[1][2]) * lt;
        return [r, g, bl];
      }
    }
    return stops[stops.length - 1][1];
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTargets();
  }

  // ---------- sample the word "STRAVANTA" into a point cloud ----------
  function buildTargets() {
    var off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    var octx = off.getContext('2d');

    var word = "STRAVANTA";
    var isSmall = W < 640;
    var isVertical = isSmall && H > W;

    octx.textBaseline = 'alphabetic';
    octx.fillStyle = '#fff';

    var minX, maxX, minY, maxY;

    if (isVertical) {
      // stack letters top-to-bottom, centered, one per line
      var maxLetterWidth = W * 0.66;
      var availableHeight = H * 0.86;
      var lineRatio = 1.08;

      var refSize = 200;
      octx.font = '900 ' + refSize + 'px Georgia, "Times New Roman", serif';
      var refMaxW = 0;
      for (var ri = 0; ri < word.length; ri++) {
        refMaxW = Math.max(refMaxW, octx.measureText(word[ri]).width);
      }

      var fontSizeFromWidth = (maxLetterWidth / refMaxW) * refSize;
      var fontSizeFromHeight = availableHeight / (word.length * lineRatio);
      var fontSize = Math.min(fontSizeFromWidth, fontSizeFromHeight);
      var lineHeight = fontSize * lineRatio;

      octx.font = '900 ' + fontSize.toFixed(1) + 'px Georgia, "Times New Roman", serif';
      octx.textAlign = 'center';

      var totalHeight = lineHeight * word.length;
      var startY = (H - totalHeight) / 2 + fontSize * 0.78;
      var centerX = W / 2;

      var cursorY = startY;
      for (var j = 0; j < word.length; j++) {
        octx.fillText(word[j], centerX, cursorY);
        cursorY += lineHeight;
      }

      octx.textAlign = 'left';
      minY = startY - fontSize * 0.9;
      maxY = cursorY - lineHeight + fontSize * 0.4;
      minX = 0; maxX = 0; // unused in vertical mode
    } else {
      var maxWidth = W * (isSmall ? 0.90 : 0.86);
      var maxFontFromHeight = H * (isSmall ? 0.30 : 0.34);
      var trackingRatio = isSmall ? 0.06 : 0.14;

      // measure at a reference size, then scale down so the word always fits maxWidth
      var refSize2 = 200;
      octx.font = '900 ' + refSize2 + 'px Georgia, "Times New Roman", serif';
      var refTotal = refSize2 * trackingRatio * (word.length - 1);
      for (var ri2 = 0; ri2 < word.length; ri2++) {
        refTotal += octx.measureText(word[ri2]).width;
      }

      var fontSize2 = Math.min((maxWidth / refTotal) * refSize2, maxFontFromHeight);
      var tracking = fontSize2 * trackingRatio;

      octx.font = '900 ' + fontSize2.toFixed(1) + 'px Georgia, "Times New Roman", serif';

      // measure total width including tracking
      var widths = [];
      var total = 0;
      for (var i = 0; i < word.length; i++) {
        var w = octx.measureText(word[i]).width;
        widths.push(w);
        total += w + (i < word.length - 1 ? tracking : 0);
      }

      var startX = (W - total) / 2;
      var baselineY = H / 2 + fontSize2 * 0.34;

      var cursorX = startX;
      for (var j2 = 0; j2 < word.length; j2++) {
        octx.fillText(word[j2], cursorX, baselineY);
        cursorX += widths[j2] + tracking;
      }

      minX = startX; maxX = cursorX;
      minY = 0; maxY = 0; // unused in horizontal mode
    }

    var imgData = octx.getImageData(0, 0, W, H).data;

    var approxArea = W * H;
    var gap = Math.max(3, Math.round(Math.sqrt(approxArea) / 170));
    if (isSmall) gap = Math.max(2, gap - 1);

    var pts = [];
    for (var y = 0; y < H; y += gap) {
      for (var x = 0; x < W; x += gap) {
        var idx = (y * W + x) * 4;
        if (imgData[idx + 3] > 120) {
          var jitter = gap * 0.5;
          var tVal = isVertical
            ? (y - minY) / Math.max(1, (maxY - minY))
            : (x - minX) / Math.max(1, (maxX - minX));
          pts.push({
            x: x + (Math.random() - 0.5) * jitter,
            y: y + (Math.random() - 0.5) * jitter,
            t: tVal
          });
        }
      }
    }

    // shuffle so the assembly sweep doesn't read left-to-right too mechanically
    for (var s = pts.length - 1; s > 0; s--) {
      var r = Math.floor(Math.random() * (s + 1));
      var tmp = pts[s]; pts[s] = pts[r]; pts[r] = tmp;
    }

    targets = pts;
    syncParticles();
  }

  function randEdgeSpawn() {
    var side = Math.floor(Math.random() * 4);
    var pad = 60;
    if (side === 0) return { x: Math.random() * W, y: -pad };
    if (side === 1) return { x: W + pad, y: Math.random() * H };
    if (side === 2) return { x: Math.random() * W, y: H + pad };
    return { x: -pad, y: Math.random() * H };
  }

  function syncParticles() {
    var n = targets.length;
    while (particles.length < n) {
      var spawn = randEdgeSpawn();
      var target = targets[particles.length];
      particles.push({
        x: spawn.x, y: spawn.y,
        vx: 0, vy: 0,
        tx: target.x, ty: target.y,
        baseTx: target.x, baseTy: target.y,
        delay: Math.random() * 900,
        size: Math.random() < 0.12 ? 2.2 : 1.35 + Math.random() * 0.6,
        color: paletteColor(target.t),
        phase: Math.random() * Math.PI * 2,
        speed: 0.55 + Math.random() * 0.9,
        twinkle: Math.random()
      });
    }
    if (particles.length > n) {
      particles.length = n;
    }
    for (var i = 0; i < particles.length; i++) {
      var t = targets[i];
      particles[i].tx = t.x;
      particles[i].ty = t.y;
      particles[i].baseTx = t.x;
      particles[i].baseTy = t.y;
      particles[i].color = paletteColor(t.t);
    }
  }

  // ---------- interaction ----------
  function setPointer(x, y) {
    mouse.x = x; mouse.y = y; mouse.active = true;
    if (cursorEl) {
      cursorEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    }
  }

  window.addEventListener('mousemove', function (e) {
    setPointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', function () {
    mouse.active = false;
  });

  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  window.addEventListener('touchend', function () {
    mouse.active = false;
  });

  function burst(cx, cy) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - cx, dy = p.y - cy;
      var dist = Math.max(18, Math.sqrt(dx * dx + dy * dy));
      var force = (1 - Math.min(dist / 520, 1)) * 14 + 2;
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  }

  window.addEventListener('mousedown', function (e) { burst(e.clientX, e.clientY); });
  window.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches[0]) {
      setPointer(e.touches[0].clientX, e.touches[0].clientY);
      burst(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  if (!pointerIsFine && cursorEl) cursorEl.style.display = 'none';

  // ---------- animation loop ----------
  var mouseRadius = 130;
  var repelStrength = 3.4;
  var spring = 0.055;
  var friction = 0.86;

  function tick(now) {
    ctx.fillStyle = 'rgba(5,3,8,0.22)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    var elapsed = now - startedAt;
    var allIn = true;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      var active = elapsed > p.delay;
      if (!active) { allIn = false; }

      if (active) {
        var wob = Math.sin(now * 0.0012 * p.speed + p.phase) * 3.2;
        var wob2 = Math.cos(now * 0.0009 * p.speed + p.phase) * 3.2;
        var tx = p.baseTx + wob;
        var ty = p.baseTy + wob2;

        var ax = (tx - p.x) * spring;
        var ay = (ty - p.y) * spring;
        p.vx += ax; p.vy += ay;
      }

      if (mouse.active) {
        var dx = p.x - mouse.x, dy = p.y - mouse.y;
        var dist2 = dx * dx + dy * dy;
        if (dist2 < mouseRadius * mouseRadius) {
          var dist = Math.sqrt(dist2) || 0.001;
          var f = (1 - dist / mouseRadius) * repelStrength;
          p.vx += (dx / dist) * f;
          p.vy += (dy / dist) * f;
        }
      }

      p.vx *= friction;
      p.vy *= friction;
      p.x += p.vx;
      p.y += p.vy;

      var flicker = 0.55 + 0.45 * Math.sin(now * 0.003 * p.speed + p.phase * 3);
      var alpha = active ? (0.55 + 0.45 * flicker) : 0;

      if (active) {
        var c = p.color;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(' + c[0].toFixed(0) + ',' + c[1].toFixed(0) + ',' + c[2].toFixed(0) + ',' + alpha.toFixed(3) + ')';
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalCompositeOperation = 'source-over';

    if (allIn && !settled) {
      settled = true;
      hintEl.classList.add('show');
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', function () {
    clearTimeout(window.__rt);
    window.__rt = setTimeout(resize, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(window.__rt);
    window.__rt = setTimeout(resize, 200);
  });

  resize();
  requestAnimationFrame(tick);
})();
</script>
